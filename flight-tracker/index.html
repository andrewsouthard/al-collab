<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈️ Planes Overhead — SDR Preview</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--bg:#0b1020;--panel:#141b33;--ink:#e7ecff;--mut:#9aa6cf;--accent:#4ea1ff;--good:#3ddc84}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid #232d52;flex-wrap:wrap}
  header h1{font-size:1.2rem;margin:0}
  header .sub{color:var(--mut);font-size:.82rem}
  .badge{background:#0e3b28;color:var(--good);border-radius:20px;padding:5px 14px;font-weight:700;font-size:1rem}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .controls label{font-size:.78rem;color:var(--mut)}
  .controls input{width:86px;background:#0e1530;border:1px solid #2a3458;color:var(--ink);border-radius:6px;padding:4px 8px;font-size:.82rem}
  #map{flex:1;min-height:0}
  .plane{background:#1b2850;border:1px solid #32416f;border-radius:10px;padding:8px 11px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .plane b{font-size:.95rem}
  .plane .meta{font-size:.8rem;color:var(--mut)}
  .plane .row{display:flex;gap:8px;font-size:.76rem;margin-top:3px}
  .plane .row span{background:#101a38;border-radius:5px;padding:1px 6px}
  .leaflet-popup-content-wrapper{background:#131c3a;color:var(--ink);border:1px solid #2a3458;border-radius:10px}
  .leaflet-popup-tip{background:#131c3a}
  #status{font-size:.78rem;color:var(--mut);font-family:ui-monospace,monospace}
</style>
</head>
<body>
<header>
  <h1>✈️ Planes Overhead</h1>
  <span class="sub">SDR preview — live data via software, no hardware</span>
  <div class="badge" id="count">…</div>
  <div class="controls">
    <label>lat <input id="lat"></label>
    <label>lon <input id="lon"></label>
    <label>range km <input id="radius" value="60"></label>
    <button id="apply">Set my house</button>
    <span id="status"></span>
  </div>
</header>
<div id="map"></div>

<script src="app.js"></script>
</body>
</html>
